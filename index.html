<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<meta name="description" content="Something new is taking root.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,400&family=Hanken+Grotesk:wght@400;600;700&family=Markazi+Text:wght@600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--green:#0E3F2C;--gold:#D69A2D;--gold2:#E7C079;--parch:#F4EEE2;}
  html{scroll-behavior:smooth}
  body{min-height:100svh;font-family:'Fraunces',serif;color:var(--parch);
    background:radial-gradient(120% 80% at 50% 38%,#134A34 0%,#0E3F2C 48%,#0A2E20 100%);
    display:flex;flex-direction:column;overflow-x:hidden}
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0}
  .charbagh{position:fixed;inset:0;opacity:.05;z-index:0;pointer-events:none}
  .glow{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(42% 28% at 50% 40%,rgba(214,154,45,.28) 0%,rgba(214,154,45,0) 70%);
    animation:pulse 6s ease-in-out infinite}
  .grain{position:fixed;inset:0;opacity:.06;mix-blend-mode:soft-light;z-index:0;pointer-events:none}

  .shell{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;min-height:100svh;
    padding:clamp(28px,5vw,52px) 24px;text-align:center}

  /* top wordmark */
  .brand{display:flex;align-items:center;gap:12px;opacity:0;animation:rise 1s ease .1s forwards}
  .brand svg{width:26px;height:auto}
  .brand .wm{font-weight:300;letter-spacing:.16em;font-size:15px}
  .brand .wm b{font-weight:300;color:var(--gold)}

  /* center */
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:clamp(22px,3.4vw,34px);padding:40px 0}
  .cs{font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:13px;
    letter-spacing:.5em;text-indent:.5em;color:var(--gold);text-transform:uppercase;
    display:flex;align-items:center;gap:16px;opacity:0;animation:rise 1s ease .3s forwards}
  .cs .r{width:38px;height:1px;background:var(--gold);opacity:.6}

  .emblem{height:clamp(120px,18vw,176px);display:flex;align-items:flex-end;opacity:0;
    animation:grow 1.5s cubic-bezier(.2,.7,.2,1) .5s forwards}
  .emblem svg{height:100%;width:auto;filter:drop-shadow(0 6px 26px rgba(214,154,45,.45))}

  .triad{line-height:1.08;letter-spacing:-.015em}
  .triad div{opacity:0}
  .triad .w{font-weight:300;font-size:clamp(46px,9vw,90px);color:var(--parch)}
  .triad .w .d{color:var(--gold)}
  .triad .fl{font-style:italic;font-weight:400;font-size:clamp(46px,9vw,90px);color:var(--gold)}
  .triad div:nth-child(1){animation:rise 1s ease .75s forwards}
  .triad div:nth-child(2){animation:rise 1s ease .9s forwards}
  .triad div:nth-child(3){animation:rise 1s ease 1.05s forwards}

  .line{font-style:italic;font-weight:400;font-size:clamp(17px,2.4vw,23px);
    color:rgba(244,238,226,.66);opacity:0;animation:rise 1s ease 1.25s forwards}

  /* email capture */
  .signup{margin-top:6px;width:100%;max-width:440px;opacity:0;animation:rise 1s ease 1.45s forwards}
  .signup form{display:flex;gap:10px;background:rgba(244,238,226,.06);
    border:1px solid rgba(231,192,121,.28);border-radius:999px;padding:7px 7px 7px 22px}
  .signup input{flex:1;background:transparent;border:none;outline:none;color:var(--parch);
    font-family:'Hanken Grotesk',sans-serif;font-size:15px;letter-spacing:.01em}
  .signup input::placeholder{color:rgba(244,238,226,.45)}
  .signup button{font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:14px;
    letter-spacing:.04em;color:var(--green);background:var(--gold);border:none;cursor:pointer;
    border-radius:999px;padding:12px 22px;transition:transform .25s ease,background .25s ease}
  .signup button:hover{transform:translateY(-1px);background:var(--gold2)}
  .micro{margin-top:12px;font-family:'Hanken Grotesk',sans-serif;font-size:12px;
    letter-spacing:.03em;color:rgba(244,238,226,.4)}
  .thanks{display:none;font-family:'Hanken Grotesk',sans-serif;font-size:15px;color:var(--gold2);padding:14px}

  /* footer */
  .foot{opacity:0;animation:rise 1s ease 1.65s forwards;display:flex;flex-direction:column;gap:8px;align-items:center}
  .foot .fa{font-family:'Markazi Text',serif;font-weight:600;font-size:24px;
    color:rgba(231,192,121,.55);direction:rtl}
  .foot .meta{font-family:'Hanken Grotesk',sans-serif;font-size:11.5px;letter-spacing:.16em;
    text-transform:uppercase;color:rgba(244,238,226,.38)}

  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  @keyframes grow{from{opacity:0;transform:scaleY(.2);transform-origin:bottom}to{opacity:1;transform:scaleY(1);transform-origin:bottom}}
  @keyframes pulse{0%,100%{opacity:.85}50%{opacity:1}}
  @media (max-width:520px){.signup form{flex-direction:column;border-radius:18px;padding:14px}.signup button{padding:13px}}
</style>
</head>
<body>
  <svg class="charbagh" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs><pattern id="cb" width="92" height="92" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#E7C079" stroke-width="1">
        <rect x="12" y="12" width="68" height="68"/><line x1="46" y1="12" x2="46" y2="80"/>
        <line x1="12" y1="46" x2="80" y2="46"/><path d="M46 32 L60 46 L46 60 L32 46 Z"/></g>
    </pattern></defs><rect width="100%" height="100%" fill="url(#cb)"/></svg>
  <div class="glow"></div>
  <svg class="grain" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/></svg>

  <div class="shell">
    <!-- top brand — remove this block if you want the page fully nameless for the teaser -->
    <div class="brand">
      <svg viewBox="0 0 120 168" xmlns="http://www.w3.org/2000/svg"><path d="M60 126 C50 121 31 105 35 78 C38 51 49 31 62 14 C75 31 84 54 86 80 C88 107 71 121 64 126 Z" fill="#D69A2D"/><rect x="56" y="120" width="8" height="30" rx="3" fill="#0E3F2C"/></svg>
      <span class="wm">BOOSTAN <b>GROUP</b></span>
    </div>

    <div class="center">
      <div class="cs"><span class="r"></span>Coming Soon<span class="r"></span></div>

      <div class="emblem">
        <svg viewBox="0 0 120 168" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="60" cy="152" rx="24" ry="4.5" fill="#0E3F2C" opacity=".4"/>
          <path d="M60 126 C50 121 31 105 35 78 C38 51 49 31 62 14 C75 31 84 54 86 80 C88 107 71 121 64 126 Z" fill="#D69A2D"/>
          <path d="M60 124 C58 99 60 60 62 22" fill="none" stroke="#0E3F2C" stroke-width="3.4" stroke-linecap="round" opacity=".55"/>
          <rect x="56" y="120" width="8" height="32" rx="3" fill="#0E3F2C"/>
        </svg>
      </div>

      <div class="triad">
        <div class="w">Plant<span class="d">.</span></div>
        <div class="w">Nurture<span class="d">.</span></div>
        <div class="fl">Flourish.</div>
      </div>

      <p class="line">Something new is taking root.</p>

      <div class="signup">
        <!-- Replace YOUR_FORM_ID with your Formspree form ID (formspree.io → New Form) -->
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" onsubmit="setTimeout(()=>{this.style.display='none';document.getElementById('ty').style.display='block'},10)">
          <input type="email" name="email" placeholder="Your email — be first to know" required>
          <button type="submit">Notify me</button>
        </form>
        <div class="thanks" id="ty">Thank you — we'll be in touch when we open the gates. 🌿</div>
        <p class="micro">No spam. Just one note when we launch.</p>
      </div>
    </div>

    <div class="foot">
      <div class="fa"><span lang="fa" dir="rtl">بِکار. بپرور. شکوفا کن.</span></div>
      <div class="meta">Boostan Group · Toronto · 2026</div>
    </div>
  </div>
</body>
</html>
